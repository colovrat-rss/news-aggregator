<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Новости</title>
<style>
body {font-family: Arial; background:#f4f4f4; padding:20px;}
.grid {display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:15px;}
.card {background:#fff; padding:15px; border-radius:10px; box-shadow:0 2px 6px rgba(0,0,0,0.1);}
.title {font-size:16px; font-weight:bold;}
.source {font-size:12px; color:#666; margin-top:5px;}
</style>
</head>
<body>

<h2>Последние новости</h2>
<div class="grid" id="news"></div>

<script>
fetch('feed.json')
  .then(r => r.json())
  .then(data => {
    const container = document.getElementById('news');
    data.forEach(n => {
      const el = document.createElement('div');
      el.className = 'card';
      el.innerHTML = `
        <div class="title"><a href="${n.link}" target="_blank">${n.title}</a></div>
        <div class="source">${n.source}</div>
      `;
      container.appendChild(el);
    });
  });
</script>

</body>
</html>
